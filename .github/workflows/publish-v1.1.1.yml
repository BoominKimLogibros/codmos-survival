name: Publish v1.1.1 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.1.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - name: Checkout v1.1.1
        uses: actions/checkout@v6
        with:
          ref: v1.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build macOS installers
        run: npm run package:mac
      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            release/CODMOS SURVIVORS-1.1.1-arm64.dmg
            release/CODMOS SURVIVORS-1.1.1-arm64.zip
            release/CODMOS SURVIVORS-1.1.1-x64.dmg
            release/CODMOS SURVIVORS-1.1.1-x64.zip

  windows:
    runs-on: windows-2025
    steps:
      - name: Checkout v1.1.1
        uses: actions/checkout@v6
        with:
          ref: v1.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run package:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/CODMOS SURVIVORS-Setup-1.1.1-x64.exe

  release:
    runs-on: ubuntu-latest
    needs: [macos, windows]
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.1 >/dev/null 2>&1; then
            gh release edit v1.1.1 --title 'CODMOS SURVIVORS 1.1.1' --notes-file release-notes/v1.1.1.md
          else
            gh release create v1.1.1 --title 'CODMOS SURVIVORS 1.1.1' --notes-file release-notes/v1.1.1.md --verify-tag
          fi
          gh release upload v1.1.1 release-assets/* --clobber
